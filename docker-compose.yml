x-sandbox-common: &sandbox-common
  user: "1000:1000"
  working_dir: /workspace
  stdin_open: true
  tty: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4096M
        pids: 250
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000
    - /run/secrets:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    - /home/agent/.secrets:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
  environment:
    - DESTROY_ON_COMMIT=1
    - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-AI Agent}
    - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agent@sandbox.local}
  volumes:
    - ${PROJECT_DIR:-.}:/workspace:rw

services:
  # Default service with full development environment (Web + Rust)
  agent-sandbox:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    image: ai-agent-sandbox:latest
    container_name: ai_agent_sandbox

  # Stage for Python backend & JavaScript frontend (Web & AI Assistant)
  agent-sandbox-web-ai-assistant:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: web-ai-assistant
    image: ai-agent-sandbox:web-ai-assistant
    container_name: ai_agent_sandbox_web_ai_assistant

  # Alias for backward compatibility
  agent-sandbox-web:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: web-ai-assistant
    image: ai-agent-sandbox:web-ai-assistant
    container_name: ai_agent_sandbox_web

  # Stage with Rust & X11 / OpenGL / Wayland libraries (Game Engine & Graphics)
  agent-sandbox-rust-game:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-game
    image: ai-agent-sandbox:rust-game
    container_name: ai_agent_sandbox_rust_game

  # Alias for backward compatibility
  agent-sandbox-rust:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-game
    image: ai-agent-sandbox:rust-game
    container_name: ai_agent_sandbox_rust
