x-sandbox-common: &sandbox-common
  user: "1000:1000"
  working_dir: /workspace
  stdin_open: true
  tty: true
  command: ["agy"]
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 4096M
        pids: 250
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m,uid=1000,gid=1000
    - /run/secrets:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    - /home/agent/.secrets:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
  environment:
    - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-AI Agent}
    - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agent@sandbox.local}
  volumes:
    - ${PROJECT_DIR:-.}:/workspace:rw
    - /home/${SUDO_USER:-$USER}/.gemini/antigravity-cli/antigravity-oauth-token:/home/agent/.gemini/antigravity-cli/antigravity-oauth-token:rw
    - /home/${SUDO_USER:-$USER}/.gemini/antigravity-cli/jetski_state.pbtxt:/home/agent/.gemini/antigravity-cli/jetski_state.pbtxt:ro
  labels:
    sandbox: ai-agent

services:
  # Stage for Python backend & JavaScript frontend (Web & AI Assistant)
  web-ai-assistant:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: web-ai-assistant
    image: ai-agent-sandbox:web-ai-assistant

  # Stage with Rust & X11 / OpenGL / Wayland libraries (Game Engine & Graphics)
  rust-game:
    <<: *sandbox-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-game
    image: ai-agent-sandbox:rust-game
